<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<title>Netzwerk-Tools</title>
<style>
/* Farben 1:1 aus GitHubs eigenen Stylesheets uebernommen:
   - Canvas und Hero-Verlauf aus home.css der abgemeldeten Startseite
     (--brand-color-canvas-default ist dort #000, nicht #0d1117)
   - Komponentenfarben aus @primer/primitives 11.9.0,
     dist/css/functional/themes/dark.css
   Original-Tokennamen stehen als Kommentar dahinter. */
:root {
  --canvas: #000;             /* brand-color-canvas-default (dark) */
  --hero-navy: #000240;       /* #hero: linear-gradient(#000240,#0000) */
  --glow-purple: #9a7cff;     /* Hero-Glow */
  --glow-violet: #5049c2;     /* SectionHero-Glow */
  --surface: #151b23;         /* bgColor-muted */
  --surface-hover: #212830;   /* control-bgColor-rest */
  --control: #212830;         /* control-bgColor-rest */
  --control-hover: #262c36;   /* control-bgColor-hover */
  --border: #3d444d;          /* borderColor-default */
  --border-muted: #3d444db3;  /* borderColor-muted */
  --translucent: #ffffff26;   /* borderColor-translucent */
  --fg: #f0f6fc;              /* fgColor-default */
  --fg-muted: #9198a1;        /* fgColor-muted */
  --accent: #4493f8;          /* fgColor-accent */
  --accent-emphasis: #1f6feb; /* bgColor-accent-emphasis */
  --accent-bg: #388bfd1a;     /* bgColor-accent-muted */
  --accent-border: #388bfd66; /* borderColor-accent-muted */
  --success: #238636;         /* bgColor-success-emphasis */
  --success-hover: #29903b;   /* button-primary-bgColor-hover */
  --success-fg: #3fb950;      /* fgColor-success */
  --danger: #f85149;          /* fgColor-danger */
  --danger-bg: #f851491a;     /* bgColor-danger-muted */
  --danger-border: #f8514966; /* borderColor-danger-muted */
  --purple: #ab7df8;          /* fgColor-done */
  --purple-bg: #ab7df826;     /* bgColor-done-muted */
  --purple-border: #ab7df866; /* borderColor-done-muted */
  --severe: #db6d28;          /* fgColor-severe */
  --severe-bg: #db6d281a;     /* bgColor-severe-muted */
  --severe-border: #db6d2866; /* borderColor-severe-muted */
  --orange: #f78166;          /* underlineNav-borderColor-active */
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--sans);
  color: var(--fg);
  /* Hero der abgemeldeten Startseite: #hero legt linear-gradient(#000240,#0000)
     ueber den schwarzen Canvas, dazu die geblurrten Glows des Karussells. */
  background:
    radial-gradient(ellipse 70% 45% at 78% 2%, color-mix(in srgb, var(--glow-purple) 30%, transparent), transparent 68%),
    radial-gradient(ellipse 55% 40% at 12% 0%, color-mix(in srgb, var(--glow-violet) 26%, transparent), transparent 66%),
    linear-gradient(var(--hero-navy), #0000 62%),
    var(--canvas);
  background-repeat: no-repeat;
  background-attachment: fixed;
  display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh;
}
.wrap { width: 100%; max-width: 720px; }
h1 { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 600; margin-bottom: 1.2rem; color: var(--fg); letter-spacing: -0.02em; }
h1 img { width: 32px; height: 32px; border-radius: 6px; }

.tabs { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 1.1rem; border-bottom: 1px solid var(--border); }
.tab { padding: 8px 14px 10px; border: none; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; font-size: 14px; font-weight: 400; cursor: pointer; background: transparent; color: var(--fg); transition: background 0.12s, border-color 0.12s; }
.tab.active { font-weight: 600; border-bottom-color: var(--orange); }
.tab:hover:not(.active) { background: var(--surface-hover); border-bottom-color: var(--fg-muted); }

.panel { display: none; }
.panel.active { display: block; }

.box { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 1.2rem; margin-bottom: 0.8rem; }
label { font-size: 14px; color: var(--fg); display: block; margin-bottom: 8px; font-weight: 600; }
input { width: 100%; font-family: var(--mono); font-size: 16px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; outline: none; background: var(--control); color: var(--fg); }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-border); }
input::placeholder { color: var(--fg-muted); }
.err { font-size: 14px; color: var(--danger); background: var(--danger-bg); border: 1px solid var(--danger-border); border-radius: 6px; padding: 8px 12px; margin-top: 8px; display: none; }

.vendor { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 0.9rem 1.2rem; margin-bottom: 0.8rem; display: none; }
.vendor-lbl { font-size: 11px; color: var(--fg-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 0.06em; }
.vendor-val { font-size: 18px; font-weight: 600; color: var(--fg); }

.fmt { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; margin-bottom: 5px; }
.fmt:hover { border-color: var(--fg-muted); }
.fmt-lbl { font-size: 13px; color: var(--fg-muted); width: 210px; flex-shrink: 0; font-weight: 400; }
.fmt-val { font-family: var(--mono); font-size: 15px; color: var(--fg); flex: 1; user-select: all; font-weight: 400; }
.copy { font-family: var(--sans); font-size: 12px; padding: 4px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--control); color: var(--fg); cursor: pointer; flex-shrink: 0; }
.copy:hover { background: var(--control-hover); border-color: var(--fg-muted); }
.copy.ok { color: var(--success-fg); border-color: var(--success-fg); background: rgba(63,185,80,0.12); }
.hint { text-align: center; padding: 2.5rem; color: var(--fg-muted); font-size: 14px; }

.net-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 0; }
.net-row { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 9px 12px; }
.net-row.wide { grid-column: 1 / -1; }
.net-lbl { font-size: 11px; color: var(--fg-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
.net-val { font-family: var(--mono); font-size: 15px; color: var(--fg); font-weight: 400; }
.net-sub { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.net-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: end; margin-bottom: 0.9rem; }
.net-inputs label { margin-bottom: 5px; }
.slash { font-size: 26px; color: var(--fg-muted); font-weight: 400; padding-bottom: 6px; text-align: center; }

.table-wrap { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; overflow-x: auto; }
.port-table { width: 100%; border-collapse: collapse; }
.port-table th { font-size: 12px; color: var(--fg-muted); font-weight: 600; padding: 8px 12px; background: var(--border-muted); border-bottom: 1px solid var(--border); text-align: left; }
.port-table td { font-size: 14px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--border-muted); color: var(--fg); vertical-align: top; }
.port-table tr:last-child td { border-bottom: none; }
.port-table tr:hover td { background: var(--surface-hover); }
.port-num { font-family: var(--mono); font-weight: 400; color: var(--fg); }
.port-proto { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; display: inline-block; border: 1px solid; }
.proto-tcp { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-border); }
.proto-udp { background: var(--severe-bg); color: var(--severe); border-color: var(--severe-border); }
.proto-both { background: var(--purple-bg); color: var(--purple); border-color: var(--purple-border); }
.port-name { font-weight: 600; color: var(--fg); }
.port-desc { color: var(--fg-muted); font-size: 13px; }
.port-nores { text-align: center; padding: 2rem; color: var(--fg-muted); font-size: 14px; }

.btn { font-family: var(--sans); padding: 6px 16px; border: 1px solid var(--translucent); border-radius: 6px; background: var(--success); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.12s; }
.btn:hover { background: var(--success-hover); }
.opts { display: flex; flex-wrap: wrap; gap: 10px 20px; margin: 4px 0 14px; }
.opts label { display: flex; align-items: center; gap: 7px; margin: 0; font-size: 14px; font-weight: 400; cursor: pointer; }
.opts input { width: auto; accent-color: var(--accent); }
input.num-inp { width: 110px; }
.split-inputs { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.sep { border-top: 1px solid var(--border); margin: 1rem 0; }
@media (max-width: 540px) {
  .fmt { flex-wrap: wrap; }
  .fmt-lbl { width: 100%; }
  .net-grid, .net-inputs, .split-inputs { grid-template-columns: 1fr; }
  .slash { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="icon.svg" alt=""> Netzwerk-Tools</h1>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('mac',this)">MAC-Konverter</button>
    <button class="tab" onclick="switchTab('net',this)">Netzwerkrechner</button>
    <button class="tab" onclick="switchTab('v6',this)">IPv6</button>
    <button class="tab" onclick="switchTab('port',this)">Port-Suche</button>
    <button class="tab" onclick="switchTab('pw',this)">Passwörter</button>
    <button class="tab" onclick="switchTab('whois',this)">Domain/IP Info</button>
  </div>

  <!-- MAC Tab -->
  <div id="tab-mac" class="panel active">
    <div class="box">
      <label>MAC-Adresse eingeben oder einfügen</label>
      <input id="mac-inp" type="text" placeholder="z.B. AA:BB:CC:DD:EE:FF oder AABBCCDDEEFF"
             oninput="runMAC(this.value)"
             onpaste="var el=this; setTimeout(function(){ runMAC(el.value); }, 10)" />
      <div class="err" id="mac-err"></div>
    </div>
    <div class="vendor" id="vcard">
      <div class="vendor-lbl">Hersteller</div>
      <div class="vendor-val" id="vval"></div>
    </div>
    <div id="mac-out"></div>
    <div class="hint" id="mac-hint">MAC-Adresse oben eingeben — alle Formate erscheinen hier</div>
  </div>

  <!-- Netzwerk Tab -->
  <div id="tab-net" class="panel">
    <div class="box">
      <div class="net-inputs">
        <div>
          <label>IP-Adresse</label>
          <input id="net-ip" type="text" placeholder="192.168.1.100" oninput="runNet()" onpaste="setTimeout(runNet,10)" />
        </div>
        <div class="slash">/</div>
        <div>
          <label>Präfix / Maske</label>
          <input id="net-mask" type="text" placeholder="24 oder 255.255.255.0" oninput="runNet()" onpaste="setTimeout(runNet,10)" />
        </div>
      </div>
      <div class="err" id="net-err"></div>
    </div>
    <div id="net-out"></div>
    <div class="hint" id="net-hint">IP-Adresse und Subnetzmaske eingeben</div>

    <div class="sep"></div>

    <div class="box">
      <label style="margin-bottom:1rem; display:block;">Kleinstes Subnetz das beide IP-Adressen enthält</label>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;">
        <div>
          <label>Erste IP-Adresse</label>
          <input id="net-ip2a" type="text" placeholder="192.168.1.10" oninput="runNet2()" onpaste="setTimeout(runNet2,10)" />
        </div>
        <div>
          <label>Zweite IP-Adresse</label>
          <input id="net-ip2b" type="text" placeholder="192.168.1.200" oninput="runNet2()" onpaste="setTimeout(runNet2,10)" />
        </div>
      </div>
      <div class="err" id="net2-err"></div>
    </div>
    <div id="net2-out"></div>

    <div class="sep"></div>

    <div class="box">
      <label style="margin-bottom:1rem; display:block;">Netz in kleinere Subnetze aufteilen</label>
      <div class="split-inputs">
        <div>
          <label>Netzadresse</label>
          <input id="split-ip" type="text" placeholder="10.20.0.0" oninput="runSplit()" onpaste="setTimeout(runSplit,10)" />
        </div>
        <div>
          <label>Präfix</label>
          <input id="split-p1" type="text" placeholder="16" oninput="runSplit()" />
        </div>
        <div>
          <label>Neues Präfix</label>
          <input id="split-p2" type="text" placeholder="24" oninput="runSplit()" />
        </div>
      </div>
      <div class="err" id="split-err"></div>
    </div>
    <div id="split-out"></div>
  </div>

  <!-- Domain/IP Info Tab -->
  <div id="tab-whois" class="panel">
    <div class="box">
      <label>Domain oder IP-Adresse</label>
      <input id="whois-inp" type="text" placeholder="z.B. netzblitz.de oder 8.8.8.8"
             onkeydown="if(event.key==='Enter') doWhois()" />
      <div style="margin-top:0.8rem;">
        <button id="whois-btn" class="btn" onclick="doWhois()">Abfragen</button>
      </div>
    </div>
    <div id="whois-out"></div>
  </div>

  <!-- IPv6 Tab -->
  <div id="tab-v6" class="panel">
    <div class="box">
      <label>IPv6-Adresse (optional mit /Präfix)</label>
      <input id="v6-inp" type="text" placeholder="z.B. 2001:db8:0:8d3::a:1f/64"
             oninput="runV6(this.value)"
             onpaste="var el=this; setTimeout(function(){ runV6(el.value); }, 10)" />
      <div class="err" id="v6-err"></div>
    </div>
    <div id="v6-out"></div>
    <div class="hint" id="v6-hint">IPv6-Adresse eingeben — Schreibweisen und Analyse erscheinen hier</div>
  </div>

  <!-- Passwort Tab -->
  <div id="tab-pw" class="panel">
    <div class="box">
      <label>Länge</label>
      <input id="pw-len" class="num-inp" type="number" min="4" max="128" value="20" oninput="runPw()" />
      <div class="opts" style="margin-top:12px;">
        <label><input type="checkbox" id="pw-low" checked onchange="runPw()"> Kleinbuchstaben</label>
        <label><input type="checkbox" id="pw-up" checked onchange="runPw()"> Großbuchstaben</label>
        <label><input type="checkbox" id="pw-dig" checked onchange="runPw()"> Ziffern</label>
        <label><input type="checkbox" id="pw-sym" checked onchange="runPw()"> Sonderzeichen</label>
        <label><input type="checkbox" id="pw-nosim" checked onchange="runPw()"> Ähnliche Zeichen vermeiden (0/O, 1/l/I)</label>
      </div>
      <button class="btn" onclick="runPw()">Neu generieren</button>
      <div class="err" id="pw-err"></div>
    </div>
    <div id="pw-out"></div>
    <div class="hint" style="padding:0.8rem;">Wird lokal im Browser erzeugt — nichts verlässt das Gerät.</div>
  </div>

  <!-- Port Tab -->
  <div id="tab-port" class="panel">
    <div class="box">
      <label>Portnummer oder Dienstname suchen</label>
      <input id="port-inp" type="text" placeholder="z.B. 443 oder rdp oder ssh"
             oninput="runPort(this.value)"
             onpaste="var el=this; setTimeout(function(){ runPort(el.value); }, 10)" />
    </div>
    <div id="port-out"></div>
    <div class="hint" id="port-hint">Portnummer oder Dienstname eingeben</div>
  </div>
</div>

<script>
/* ── Tab-Steuerung ── */
function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  document.getElementById('tab-' + name).classList.add('active');
  btn.classList.add('active');
}

/* ── Gemeinsame Helfer ── */
function netRow(lbl,val,sub,wide){
  return '<div class="net-row'+(wide?' wide':'')+'"><div class="net-lbl">'+lbl+'</div><div class="net-val">'+val+'</div>'+(sub?'<div class="net-sub">'+sub+'</div>':'')+'</div>';
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ══════════════════════════════
   MAC-KONVERTER
══════════════════════════════ */
var MAC_FMTS = [
  ["IEEE 802",              function(b){ return b.join(':'); }],
  ["Windows (Bindestrich)", function(b){ return b.map(u).join('-'); }],
  ["Ohne Trennzeichen",     function(b){ return b.map(u).join(''); }],
  ["Cisco (Gruppen à 4)",  function(b){ var h=b.join('').toUpperCase(); return h.slice(0,4)+'.'+h.slice(4,8)+'.'+h.slice(8); }],
  ["IPv6 Link-Local (EUI-64)", eui64]
];
function u(x){ return x.toUpperCase(); }

function eui64(b) {
  var x = parseInt(b[0],16) ^ 0x02;
  var e = [(x<16?'0':'')+x.toString(16), b[1], b[2], 'ff', 'fe', b[3], b[4], b[5]];
  var h = [];
  for (var i=0;i<8;i+=2) h.push(parseInt(e[i]+e[i+1],16).toString(16));
  return 'fe80::' + h.join(':');
}

function parseMAC(raw) {
  var s = raw.replace(/[^0-9a-fA-F]/g,'');
  if (s.length !== 12) return null;
  var b=[]; for(var i=0;i<12;i+=2) b.push(s.slice(i,i+2).toLowerCase());
  return b;
}

var vendorTimer = null;
function runMAC(val) {
  var err=document.getElementById('mac-err'), out=document.getElementById('mac-out'),
      hint=document.getElementById('mac-hint'), vcard=document.getElementById('vcard'),
      vval=document.getElementById('vval');
  if (!val||val.trim()==='') { err.style.display='none'; out.innerHTML=''; hint.style.display='block'; vcard.style.display='none'; return; }
  var b=parseMAC(val);
  if (!b) { err.textContent='Keine gültige MAC-Adresse — bitte 12 Hex-Zeichen eingeben.'; err.style.display='block'; out.innerHTML=''; hint.style.display='none'; vcard.style.display='none'; return; }
  err.style.display='none'; hint.style.display='none';
  var html='';
  for(var i=0;i<MAC_FMTS.length;i++){
    var v=MAC_FMTS[i][1](b);
    html+='<div class="fmt"><span class="fmt-lbl">'+MAC_FMTS[i][0]+'</span><span class="fmt-val" id="mv'+i+'">'+v+'</span><button class="copy" onclick="cp(\'mv'+i+'\',this)">Kopieren</button></div>';
  }
  var b0 = parseInt(b[0],16);
  html+='<div class="net-grid" style="margin-top:8px;">'
    +netRow('OUI (Hersteller-Teil)', b.slice(0,3).map(u).join(':'), '')
    +netRow('NIC (Geräte-Teil)', b.slice(3).map(u).join(':'), '')
    +netRow('Adresstyp', (b0&1)?'Multicast':'Unicast', 'I/G-Bit')
    +netRow('Vergabe', (b0&2)?'Lokal verwaltet':'Global (IEEE-OUI)', 'U/L-Bit')
  +'</div>';
  out.innerHTML=html;
  vval.textContent='…'; vcard.style.display='block';
  clearTimeout(vendorTimer);
  vendorTimer=setTimeout(function(){
    var mac=b.map(u).join(':');
    var url='https://api.macvendors.com/'+encodeURIComponent(mac);
    fetch('https://corsproxy.io/?'+encodeURIComponent(url))
      .then(function(r){ return r.status===404?'Unbekannt':(r.ok?r.text():Promise.reject()); })
      .then(function(t){ vval.textContent=(t||'').trim()||'Unbekannt'; })
      .catch(function(){ vval.textContent='Abfrage fehlgeschlagen'; });
  },500);
}

/* ══════════════════════════════
   NETZWERKRECHNER
══════════════════════════════ */
function parseIP(s) {
  var p=s.trim().split('.');
  if(p.length!==4) return null;
  var n=0;
  for(var i=0;i<4;i++){
    var x=parseInt(p[i],10);
    if(isNaN(x)||x<0||x>255) return null;
    n=(n<<8)|x;
  }
  return n>>>0;
}

function ip2str(n) {
  return [(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255].join('.');
}

function parseMask(s) {
  s=s.trim();
  if(/^\d+$/.test(s)){
    var p=parseInt(s,10);
    if(p<0||p>32) return null;
    return p===0?0:(0xFFFFFFFF<<(32-p))>>>0;
  }
  var m=parseIP(s);
  if(m===null) return null;
  var inv=~m>>>0;
  if((inv&(inv+1))!==0) return null;
  return m;
}

function maskToCidr(m) {
  var n=0, x=m;
  while(x){ n+=x&1; x>>>=1; }
  return n;
}

function ipClass(ip) {
  var f=(ip>>>24)&255;
  if(f<128) return 'A'; if(f<192) return 'B'; if(f<224) return 'C';
  if(f<240) return 'D (Multicast)'; return 'E (Reserviert)';
}

function runNet() {
  var ipEl=document.getElementById('net-ip'), maskEl=document.getElementById('net-mask'),
      err=document.getElementById('net-err'), out=document.getElementById('net-out'),
      hint=document.getElementById('net-hint');
  var ipStr=ipEl.value.trim(), maskStr=maskEl.value.trim();
  if(!ipStr&&!maskStr){ err.style.display='none'; out.innerHTML=''; hint.style.display='block'; return; }
  hint.style.display='none';
  var ip=parseIP(ipStr);
  if(ip===null&&ipStr){ err.textContent='Ungültige IP-Adresse.'; err.style.display='block'; out.innerHTML=''; return; }
  var mask=maskStr?parseMask(maskStr):null;
  if(mask===null&&maskStr){ err.textContent='Ungültige Subnetzmaske / Präfix.'; err.style.display='block'; out.innerHTML=''; return; }
  err.style.display='none';
  if(ip===null||mask===null){ out.innerHTML=''; return; }

  var cidr=maskToCidr(mask);
  var network=(ip&mask)>>>0;
  var broadcast=(network|(~mask>>>0))>>>0;
  var wildcard=(~mask)>>>0;
  var hosts=cidr>=31?Math.pow(2,32-cidr):Math.pow(2,32-cidr)-2;
  var first=cidr>=31?network:(network+1)>>>0;
  var last=cidr>=31?broadcast:(broadcast-1)>>>0;

  out.innerHTML='<div class="net-grid">'
    +netRow('Netzwerkadresse', ip2str(network)+'/'+cidr, '', true)
    +netRow('Subnetzmaske', ip2str(mask), '')
    +netRow('Wildcard-Maske', ip2str(wildcard), '')
    +netRow('Broadcast', ip2str(broadcast), '')
    +netRow('Erster Host', ip2str(first), '')
    +netRow('Letzter Host', ip2str(last), '')
    +netRow('Nutzbare Hosts', hosts.toLocaleString('de'), '')
    +netRow('IP-Klasse', ipClass(ip), '')
    +netRow('Eingegebene IP', ip2str(ip), cidr<32?('Hostanteil: '+ip2str((ip&wildcard)>>>0)):'')
  +'</div>';
}

/* ── Kleinstes gemeinsames Subnetz ── */
function runNet2() {
  var aEl=document.getElementById('net-ip2a'), bEl=document.getElementById('net-ip2b'),
      err=document.getElementById('net2-err'), out=document.getElementById('net2-out');
  var aStr=aEl.value.trim(), bStr=bEl.value.trim();
  if(!aStr&&!bStr){ err.style.display='none'; out.innerHTML=''; return; }
  var a=parseIP(aStr), b=parseIP(bStr);
  if(a===null&&aStr){ err.textContent='Erste IP-Adresse ungültig.'; err.style.display='block'; out.innerHTML=''; return; }
  if(b===null&&bStr){ err.textContent='Zweite IP-Adresse ungültig.'; err.style.display='block'; out.innerHTML=''; return; }
  err.style.display='none';
  if(a===null||b===null){ out.innerHTML=''; return; }

  var xor=(a^b)>>>0;
  var cidr=32;
  if(xor!==0){
    var msb=Math.floor(Math.log2(xor));
    cidr=31-msb;
  }
  var mask=cidr===0?0:(0xFFFFFFFF<<(32-cidr))>>>0;
  var network=(a&mask)>>>0;
  var broadcast=(network|(~mask>>>0))>>>0;
  var wildcard=(~mask)>>>0;
  var hosts=cidr>=31?Math.pow(2,32-cidr):Math.pow(2,32-cidr)-2;
  var first=cidr>=31?network:(network+1)>>>0;
  var last=cidr>=31?broadcast:(broadcast-1)>>>0;

  out.innerHTML='<div class="net-grid" style="margin-top:0.7rem;">'
    +netRow('Kleinstes Subnetz', ip2str(network)+'/'+cidr, '', true)
    +netRow('Subnetzmaske', ip2str(mask), '')
    +netRow('Wildcard-Maske', ip2str(wildcard), '')
    +netRow('Broadcast', ip2str(broadcast), '')
    +netRow('Erster Host', ip2str(first), '')
    +netRow('Letzter Host', ip2str(last), '')
    +netRow('Nutzbare Hosts', hosts.toLocaleString('de'), '')
    +netRow('Erste IP', ip2str(a), '')
    +netRow('Zweite IP', ip2str(b), '')
  +'</div>';
}

══════════════════════════════ */
function parsePrefix(s) {
  if(!/^\d{1,2}$/.test(s)) return null;
  var p=parseInt(s,10);
  return p>32?null:p;
}

function runSplit() {
  var ipStr=document.getElementById('split-ip').value.trim(),
      p1Str=document.getElementById('split-p1').value.trim(),
      p2Str=document.getElementById('split-p2').value.trim(),
      err=document.getElementById('split-err'), out=document.getElementById('split-out');
  if(!ipStr&&!p1Str&&!p2Str){ err.style.display='none'; out.innerHTML=''; return; }
  var ip=parseIP(ipStr);
  if(ip===null&&ipStr){ err.textContent='Ungültige Netzadresse.'; err.style.display='block'; out.innerHTML=''; return; }
  var p1=p1Str?parsePrefix(p1Str):null;
  if(p1===null&&p1Str){ err.textContent='Ungültiges Präfix (0–32).'; err.style.display='block'; out.innerHTML=''; return; }
  var p2=p2Str?parsePrefix(p2Str):null;
  if(p2===null&&p2Str){ err.textContent='Ungültiges neues Präfix (0–32).'; err.style.display='block'; out.innerHTML=''; return; }
  if(ip===null||p1===null||p2===null){ err.style.display='none'; out.innerHTML=''; return; }
  if(p2<=p1){ err.textContent='Das neue Präfix muss größer als /'+p1+' sein.'; err.style.display='block'; out.innerHTML=''; return; }
  err.style.display='none';

  var mask1=p1===0?0:(0xFFFFFFFF<<(32-p1))>>>0;
  var network=(ip&mask1)>>>0;
  var note=network!==ip?'Eingabe war eine Host-Adresse — verwendet wird '+ip2str(network)+'/'+p1:'';
  var count=Math.pow(2,p2-p1), size=Math.pow(2,32-p2);
  var hosts=p2>=31?size:size-2;

  var html='<div class="net-grid" style="margin-top:0.7rem;">'
    +netRow('Aufteilung', ip2str(network)+'/'+p1+' → /'+p2, note, true)
    +netRow('Anzahl Subnetze', count.toLocaleString('de'), '')
    +netRow('Nutzbare Hosts je Subnetz', hosts.toLocaleString('de'), '')
  +'</div>';

  var shown=Math.min(count,32), rows='';
  for(var i=0;i<shown;i++){
    var s=(network+i*size)>>>0, bc=(s+size-1)>>>0;
    var f=p2>=31?s:(s+1)>>>0, l=p2>=31?bc:(bc-1)>>>0;
    rows+='<tr><td class="port-num">'+ip2str(s)+'/'+p2+'</td><td class="port-desc">'+ip2str(f)+' – '+ip2str(l)+'</td><td class="port-desc">'+ip2str(bc)+'</td></tr>';
  }
  if(count>shown) rows+='<tr><td colspan="3" class="port-desc" style="text-align:center;">… und '+(count-shown).toLocaleString('de')+' weitere Subnetze</td></tr>';
  html+='<div class="table-wrap" style="margin-top:6px;">'
    +'<table class="port-table"><thead><tr><th>Subnetz</th><th>Hostbereich</th><th>Broadcast</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  out.innerHTML=html;
}

/* ══════════════════════════════
   IPv6-ANALYSE
══════════════════════════════ */
function pad4(n){ var s=n.toString(16); while(s.length<4) s='0'+s; return s; }

function parseIPv6(str) {
  var s=str.trim().toLowerCase(), pfx=null;
  var sl=s.indexOf('/');
  if(sl!==-1){
    var ps=s.slice(sl+1);
    if(!/^\d{1,3}$/.test(ps)) return null;
    pfx=parseInt(ps,10);
    if(pfx>128) return null;
    s=s.slice(0,sl);
  }
  var pct=s.indexOf('%');
  if(pct!==-1) s=s.slice(0,pct);
  if(s===''||s.indexOf(':::')!==-1) return null;
  var dbl=s.indexOf('::');
  if(dbl!==s.lastIndexOf('::')) return null;
  function groups(part){
    if(part==='') return [];
    var gs=part.split(':'), out=[];
    for(var i=0;i<gs.length;i++){
      var g=gs[i];
      if(g==='') return null;
      if(g.indexOf('.')!==-1){
        if(i!==gs.length-1) return null;
        var v4=parseIP(g);
        if(v4===null) return null;
        out.push((v4>>>16)&0xFFFF, v4&0xFFFF);
      } else {
        if(!/^[0-9a-f]{1,4}$/.test(g)) return null;
        out.push(parseInt(g,16));
      }
    }
    return out;
  }
  var h;
  if(dbl!==-1){
    var L=groups(s.slice(0,dbl)), R=groups(s.slice(dbl+2));
    if(L===null||R===null||L.length+R.length>7) return null;
    h=L.slice();
    var fill=8-L.length-R.length;
    for(var i=0;i<fill;i++) h.push(0);
    h=h.concat(R);
  } else {
    h=groups(s);
    if(h===null||h.length!==8) return null;
  }
  return { h:h, pfx:pfx };
}

function comp6(h) {
  var best=-1,bestLen=0,cur=-1,curLen=0;
  for(var i=0;i<8;i++){
    if(h[i]===0){ if(cur===-1)cur=i; curLen++; if(curLen>bestLen){best=cur;bestLen=curLen;} }
    else { cur=-1; curLen=0; }
  }
  function hx(g){ return g.toString(16); }
  if(bestLen<2) return h.map(hx).join(':');
  return h.slice(0,best).map(hx).join(':')+'::'+h.slice(best+bestLen).map(hx).join(':');
}

function ip6Type(h) {
  var sum=0; for(var i=0;i<8;i++) sum+=h[i];
  if(sum===0) return 'Unspezifiziert (::)';
  if(sum===1&&h[7]===1) return 'Loopback (::1)';
  if(h[0]===0&&h[1]===0&&h[2]===0&&h[3]===0&&h[4]===0&&h[5]===0xFFFF) return 'IPv4-gemappt (::ffff:0:0/96)';
  if((h[0]&0xFFC0)===0xFE80) return 'Link-Local (fe80::/10)';
  if((h[0]&0xFE00)===0xFC00) return 'Unique Local — privat (fc00::/7)';
  if((h[0]&0xFF00)===0xFF00) return 'Multicast (ff00::/8)';
  if(h[0]===0x2001&&h[1]===0x0DB8) return 'Dokumentation (2001:db8::/32)';
  if((h[0]&0xE000)===0x2000) return 'Global Unicast (2000::/3)';
  return 'Reserviert / Sonderbereich';
}

function rdns6(h) {
  var nib='';
  for(var i=0;i<8;i++) nib+=pad4(h[i]);
  return nib.split('').reverse().join('.')+'.ip6.arpa';
}

function net6(h,p) {
  var out=[];
  for(var i=0;i<8;i++){
    var bits=Math.max(0,Math.min(16,p-16*i));
    out.push(bits===0?0:(h[i]&((0xFFFF<<(16-bits))&0xFFFF)));
  }
  return out;
}

function runV6(val) {
  var err=document.getElementById('v6-err'), out=document.getElementById('v6-out'),
      hint=document.getElementById('v6-hint');
  if(!val||val.trim()===''){ err.style.display='none'; out.innerHTML=''; hint.style.display='block'; return; }
  var r=parseIPv6(val);
  if(!r){ err.textContent='Keine gültige IPv6-Adresse.'; err.style.display='block'; out.innerHTML=''; hint.style.display='none'; return; }
  err.style.display='none'; hint.style.display='none';
  var h=r.h, full=h.map(pad4).join(':');
  function longVal(v){ return '<span style="word-break:break-all;">'+v+'</span>'; }
  var html='<div class="net-grid">'
    +netRow('Komprimiert (RFC 5952)', longVal(comp6(h)+(r.pfx!==null?'/'+r.pfx:'')), '', true)
    +netRow('Vollständig', longVal(full), '', true)
    +netRow('Typ', ip6Type(h), '', true);
  if(h[0]===0&&h[1]===0&&h[2]===0&&h[3]===0&&h[4]===0&&h[5]===0xFFFF)
    html+=netRow('Eingebettete IPv4', ((h[6]>>>8)&255)+'.'+(h[6]&255)+'.'+((h[7]>>>8)&255)+'.'+(h[7]&255), '', true);
  if(r.pfx!==null)
    html+=netRow('Netzwerk', longVal(comp6(net6(h,r.pfx))+'/'+r.pfx), '', true);
  html+=netRow('Reverse DNS', '<span style="font-size:13px;word-break:break-all;">'+rdns6(h)+'</span>', '', true)
    +'</div>';
  out.innerHTML=html;
}

/* ══════════════════════════════
   PASSWORT-GENERATOR
══════════════════════════════ */
var PW_SETS=[
  ['pw-low','abcdefghijklmnopqrstuvwxyz'],
  ['pw-up','ABCDEFGHIJKLMNOPQRSTUVWXYZ'],
  ['pw-dig','0123456789'],
  ['pw-sym','!#$%&()*+,-./:;=?@[]^_{}~']
];

function pwRand(n) {
  if(window.crypto&&window.crypto.getRandomValues){
    var a=new Uint32Array(1), lim=4294967296-(4294967296%n);
    do{ window.crypto.getRandomValues(a); }while(a[0]>=lim);
    return a[0]%n;
  }
  return Math.floor(Math.random()*n);
}

function runPw() {
  var err=document.getElementById('pw-err'), out=document.getElementById('pw-out');
  var len=parseInt(document.getElementById('pw-len').value,10);
  if(isNaN(len)) len=20;
  if(len<4) len=4;
  if(len>128) len=128;
  var noSim=document.getElementById('pw-nosim').checked;
  var sets=[];
  for(var i=0;i<PW_SETS.length;i++){
    if(document.getElementById(PW_SETS[i][0]).checked){
      var cs=PW_SETS[i][1];
      if(noSim) cs=cs.replace(/[Il1O0o]/g,'');
      sets.push(cs);
    }
  }
  if(!sets.length){ err.textContent='Mindestens eine Zeichengruppe auswählen.'; err.style.display='block'; out.innerHTML=''; return; }
  err.style.display='none';
  var pool=sets.join(''), pws=[], html='';
  for(var k=0;k<5;k++){
    var ch=[];
    for(var i=0;i<sets.length;i++) ch.push(sets[i].charAt(pwRand(sets[i].length)));
    while(ch.length<len) ch.push(pool.charAt(pwRand(pool.length)));
    for(var i=ch.length-1;i>0;i--){ var j=pwRand(i+1), t=ch[i]; ch[i]=ch[j]; ch[j]=t; }
    pws.push(ch.join(''));
    html+='<div class="fmt"><span class="fmt-val" id="pwv'+k+'" style="word-break:break-all;"></span><button class="copy" onclick="cp(\'pwv'+k+'\',this)">Kopieren</button></div>';
  }
  out.innerHTML=html;
  // textContent statt innerHTML: Sonderzeichen wie < dürfen kein Markup werden
  for(var k=0;k<5;k++) document.getElementById('pwv'+k).textContent=pws[k];
}

/* ── Kopieren ── */
function cp(id, btn) {
  var val=document.getElementById(id).textContent;
  function done(){
    btn.textContent='✓ Kopiert'; btn.className='copy ok';
    setTimeout(function(){ btn.textContent='Kopieren'; btn.className='copy'; },1500);
  }
  function fallback(){
    try {
      var ta=document.createElement('textarea'); ta.value=val; ta.style.position='fixed'; ta.style.top='-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      done();
    } catch(e){}
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(val).then(done,fallback); }
  else fallback();
}
