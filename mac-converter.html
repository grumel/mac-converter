<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1e3a5f">
<link rel="manifest" href="manifest.json">
<title>MAC-Adress-Konverter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Arial, sans-serif; background: linear-gradient(135deg, #47489a 0%, #3b6bb8 45%, #4a8ec8 100%); display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
.wrap { width: 100%; max-width: 660px; }
h1 { font-size: 22px; font-weight: 700; margin-bottom: 1.2rem; color: #ffffff; letter-spacing: 0.03em; }
.box { background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22); border-radius: 12px; padding: 1.3rem; margin-bottom: 0.9rem; backdrop-filter: blur(4px); }
label { font-size: 15px; color: #d8eeff; display: block; margin-bottom: 8px; font-weight: 500; }
input { width: 100%; font-family: "Courier New", monospace; font-size: 19px; padding: 11px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; outline: none; background: rgba(255,255,255,0.95); color: #1a2535; }
input:focus { border-color: #0e8a99; box-shadow: 0 0 0 3px rgba(14,138,153,0.35); }
input::placeholder { color: #8aaccc; }
.err { font-size: 15px; color: #ffaaaa; margin-top: 7px; display: none; }
.vendor { background: rgba(255,255,255,0.95); border-radius: 12px; padding: 1rem 1.3rem; margin-bottom: 0.9rem; display: none; }
.vendor-lbl { font-size: 12px; color: #0e7585; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.07em; }
.vendor-val { font-size: 19px; font-weight: 700; color: #1a2535; }
.fmt { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.95); border-radius: 8px; padding: 10px 14px; margin-bottom: 5px; }
.fmt-lbl { font-size: 14px; color: #0e7585; width: 210px; flex-shrink: 0; font-weight: 600; }
.fmt-val { font-family: "Courier New", monospace; font-size: 17px; color: #1a2535; flex: 1; user-select: all; font-weight: 700; }
.copy { font-size: 13px; padding: 5px 13px; border: 1px solid #b0c8e0; border-radius: 5px; background: #f0f6ff; color: #3a6090; cursor: pointer; flex-shrink: 0; }
.copy:hover { background: #ddeeff; color: #1a4070; border-color: #7aaad0; }
.copy.ok { color: #1a9050; border-color: #1a9050; background: #e8fff0; }
.hint { text-align: center; padding: 2.5rem; color: rgba(255,255,255,0.5); font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MAC-Adress-Konverter</h1>

  <div class="box">
    <label>MAC-Adresse eingeben oder einfügen</label>
    <input id="inp" type="text" placeholder="z.B. AA:BB:CC:DD:EE:FF oder AABBCCDDEEFF"
           oninput="run(this.value)"
           onpaste="var el=this; setTimeout(function(){ run(el.value); }, 10)" />
    <div class="err" id="err"></div>
  </div>

  <div class="vendor" id="vcard">
    <div class="vendor-lbl">Hersteller</div>
    <div class="vendor-val" id="vval"></div>
  </div>

  <div id="out"></div>

  <div class="hint" id="hint">MAC-Adresse oben eingeben &mdash; alle Formate erscheinen hier</div>
</div>

<script>
var FMTS = [
  ["IEEE 802",             function(b){ return b.join(':'); }],
  ["Windows (Bindestrich)", function(b){ return b.map(function(x){return x.toUpperCase();}).join('-'); }],
  ["Ohne Trennzeichen",    function(b){ return b.map(function(x){return x.toUpperCase();}).join(''); }],
  ["Cisco (Gruppen à 4)", function(b){ var h=b.join('').toUpperCase(); return h.slice(0,4)+'.'+h.slice(4,8)+'.'+h.slice(8); }]
];

function parse(raw) {
  var s = raw.replace(/[^0-9a-fA-F]/g, '');
  if (s.length !== 12) return null;
  var b = [];
  for (var i = 0; i < 12; i += 2) b.push(s.slice(i, i+2).toLowerCase());
  return b;
}

var vendorTimer = null;

function run(val) {
  var err = document.getElementById('err');
  var out = document.getElementById('out');
  var hint = document.getElementById('hint');
  var vcard = document.getElementById('vcard');
  var vval = document.getElementById('vval');

  if (!val || val.trim() === '') {
    err.style.display = 'none';
    out.innerHTML = '';
    hint.style.display = 'block';
    vcard.style.display = 'none';
    return;
  }

  var b = parse(val);
  if (!b) {
    err.textContent = 'Keine gültige MAC-Adresse — bitte 12 Hex-Zeichen eingeben.';
    err.style.display = 'block';
    out.innerHTML = '';
    hint.style.display = 'none';
    vcard.style.display = 'none';
    return;
  }

  err.style.display = 'none';
  hint.style.display = 'none';

  var html = '';
  for (var i = 0; i < FMTS.length; i++) {
    var v = FMTS[i][1](b);
    html += '<div class="fmt">'
      + '<span class="fmt-lbl">' + FMTS[i][0] + '</span>'
      + '<span class="fmt-val" id="v' + i + '">' + v + '</span>'
      + '<button class="copy" onclick="cp(' + i + ')">Kopieren</button>'
      + '</div>';
  }
  out.innerHTML = html;

  vval.textContent = '…';
  vcard.style.display = 'block';

  clearTimeout(vendorTimer);
  vendorTimer = setTimeout(function() {
    var mac = b.map(function(x){ return x.toUpperCase(); }).join(':');
    fetch('https://api.macvendors.com/' + encodeURIComponent(mac))
      .then(function(r) {
        if (r.status === 404) { vval.textContent = 'Unbekannt'; return; }
        if (r.status === 429) { vval.textContent = 'Rate limit — bitte kurz warten'; return; }
        if (!r.ok) { vval.textContent = 'Fehler bei der Abfrage'; return; }
        return r.text().then(function(t) { vval.textContent = t.trim() || 'Unbekannt'; });
      })
      .catch(function() { vval.textContent = 'Kein Internetzugriff'; });
  }, 500);
}

function cp(i) {
  var val = document.getElementById('v' + i).textContent;
  var btn = document.querySelectorAll('.copy')[i];
  try {
    var ta = document.createElement('textarea');
    ta.value = val;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Kopiert';
    btn.className = 'copy ok';
    setTimeout(function(){ btn.textContent = 'Kopieren'; btn.className = 'copy'; }, 1500);
  } catch(e) {}
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
