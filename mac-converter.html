<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Segoe UI", Arial, sans-serif; background: #1e3a5f; display: flex; justify-content: center; padding: 2rem 1rem; min-height: 100vh; }
.wrap { width: 100%; max-width: 640px; }
h1 { font-size: 20px; font-weight: 600; margin-bottom: 1.2rem; color: #d6e8ff; }
.box { background: #253f63; border: 1px solid #3a5f8f; border-radius: 10px; padding: 1.2rem; margin-bottom: 0.8rem; }
label { font-size: 14px; color: #9bbcdf; display: block; margin-bottom: 7px; }
input { width: 100%; font-family: "Courier New", monospace; font-size: 17px; padding: 10px; border: 1px solid #3a5f8f; border-radius: 6px; outline: none; background: #1a3050; color: #e8f4ff; }
input:focus { border-color: #5b9bd5; box-shadow: 0 0 0 2px rgba(91,155,213,0.3); }
input::placeholder { color: #4a6f99; }
.err { font-size: 14px; color: #f08080; margin-top: 6px; display: none; }
.vendor { background: #1a3a5c; border: 1px solid #3a6090; border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 0.8rem; display: none; }
.vendor-lbl { font-size: 12px; color: #7aaed6; font-weight: 600; text-transform: uppercase; margin-bottom: 3px; letter-spacing: 0.05em; }
.vendor-val { font-size: 17px; font-weight: 600; color: #c8e4ff; }
.fmt { display: flex; align-items: center; gap: 10px; background: #253f63; border: 1px solid #3a5a88; border-radius: 6px; padding: 9px 12px; margin-bottom: 4px; }
.fmt-lbl { font-size: 13px; color: #7aaed6; width: 200px; flex-shrink: 0; }
.fmt-val { font-family: "Courier New", monospace; font-size: 15px; color: #e8f4ff; flex: 1; user-select: all; }
.copy { font-size: 13px; padding: 4px 12px; border: 1px solid #4a7aaa; border-radius: 5px; background: #1a3050; color: #9bbcdf; cursor: pointer; flex-shrink: 0; }
.copy:hover { background: #2a4a70; color: #c8e4ff; }
.copy.ok { color: #5dbb7a; border-color: #5dbb7a; }
.hint { text-align: center; padding: 2.5rem; color: #4a6f99; font-size: 15px; }
</style>

<div class="wrap">
  <h1>MAC-Adress-Konverter</h1>

           oninput="run(this.value)"

</div>

function parse(raw) {
  var s = raw.replace(/[^0-9a-fA-F]/g, '');
  if (s.length !== 12) return null;
  var b = [];
  for (var i = 0; i < 12; i += 2) b.push(s.slice(i, i+2).toLowerCase());
  return b;
}

  var err = document.getElementById('err');
  var out = document.getElementById('out');
  var hint = document.getElementById('hint');
  var vcard = document.getElementById('vcard');
  var vval = document.getElementById('vval');

  if (!val || val.trim() === '') {
    err.style.display = 'none';
    out.innerHTML = '';
    hint.style.display = 'block';
    vcard.style.display = 'none';
    return;
  }

  var b = parse(val);
  if (!b) {
    err.textContent = 'Keine gültige MAC-Adresse — bitte 12 Hex-Zeichen eingeben.';
    err.style.display = 'block';
    out.innerHTML = '';
    hint.style.display = 'none';
    vcard.style.display = 'none';
    return;
  }

  err.style.display = 'none';
  hint.style.display = 'none';

  var key = b.slice(0,3).map(function(x){return x.toUpperCase();}).join('');
  var localVendor = OUI[key] || null;
  vval.textContent = localVendor || '…';
  vcard.style.display = 'block';
  var mac = b.map(function(x){return x.toUpperCase();}).join(':');
  fetch('https://api.macvendors.com/' + encodeURIComponent(mac))
    .then(function(r){ return r.ok ? r.text() : null; })
    .then(function(t){ vval.textContent = (t && t.trim()) ? t.trim() : (localVendor || 'Unbekannt'); })
    .catch(function(){ if (!localVendor) vval.textContent = 'Unbekannt'; });

  var html = '';
  for (var i = 0; i < FMTS.length; i++) {
    var v = FMTS[i][1](b);
    html += '<div class="fmt">'
      + '<span class="fmt-lbl">' + FMTS[i][0] + '</span>'
      + '<span class="fmt-val" id="v' + i + '">' + v + '</span>'
      + '<button class="copy" onclick="cp(' + i + ')">Kopieren</button>'
      + '</div>';
  }
  out.innerHTML = html;
}

function cp(i) {
  var val = document.getElementById('v' + i).textContent;
  var btn = document.querySelectorAll('.copy')[i];
  try {
    var ta = document.createElement('textarea');
    ta.value = val;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Kopiert';
    btn.className = 'copy ok';
    setTimeout(function(){ btn.textContent = 'Kopieren'; btn.className = 'copy'; }, 1500);
  } catch(e) {}
}
</script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
