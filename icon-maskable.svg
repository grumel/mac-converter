<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Netzwerk-Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b7fe"/>
      <stop offset="0.45" stop-color="#9a7cff"/>
      <stop offset="1" stop-color="#5049c2"/>
    </linearGradient>
  </defs>
  <!-- Randlos: die Ecken schneidet die Maske des Betriebssystems weg.
       Motiv bleibt in der Safe-Zone (Kreis mit Radius 204 um die Mitte). -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-width="16" stroke-linecap="round" opacity="0.92">
    <line x1="256" y1="256" x2="256" y2="145"/>
    <line x1="256" y1="256" x2="160" y2="317"/>
    <line x1="256" y1="256" x2="352" y2="317"/>
  </g>
  <g fill="#ffffff">
    <circle cx="256" cy="256" r="34"/>
    <circle cx="256" cy="145" r="25"/>
    <circle cx="160" cy="317" r="25"/>
    <circle cx="352" cy="317" r="25"/>
  </g>
</svg>
